<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" width="680" height="296">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="215.0" y="12.0" width="250.0" height="62.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="340.0" y="34.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">L'ÉTAT</text>
<text x="340.0" y="54.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">personne morale de droit public</text>
<rect x="10.0" y="140.0" width="214.0" height="110.0" rx="8" fill="#efe3cf" stroke="#b35c00" stroke-width="1.4"/>
<text x="117.0" y="162.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">LE TERRITOIRE</text>
<text x="117.0" y="182.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">élément matériel</text>
<text x="117.0" y="197.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">surface, sol, sous-sol,</text>
<text x="117.0" y="212.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">mer territoriale, espace aérien</text>
<text x="117.0" y="227.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">délimité par des frontières</text>
<line x1="117.0" y1="140.0" x2="340.0" y2="78.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="233.0" y="140.0" width="214.0" height="110.0" rx="8" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.4"/>
<text x="340.0" y="162.0" font-size="13" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">LA POPULATION</text>
<text x="340.0" y="182.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">élément humain</text>
<text x="340.0" y="197.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">les nationaux, rattachés</text>
<text x="340.0" y="212.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">à l'État par la nationalité</text>
<text x="340.0" y="227.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(+ les étrangers, administrés)</text>
<line x1="340.0" y1="140.0" x2="340.0" y2="78.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="456.0" y="140.0" width="214.0" height="110.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="563.0" y="162.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">LA SOUVERAINETÉ</text>
<text x="563.0" y="182.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">élément politique</text>
<text x="563.0" y="197.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">un pouvoir suprême,</text>
<text x="563.0" y="212.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">indivisible et perpétuel,</text>
<text x="563.0" y="227.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">interne et externe</text>
<line x1="563.0" y1="140.0" x2="340.0" y2="78.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<text x="340.0" y="282.0" font-size="12.5" fill="#b3261e" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Trois éléments cumulatifs : s'il en manque un seul, il n'y a pas d'État.</text>
</svg>
