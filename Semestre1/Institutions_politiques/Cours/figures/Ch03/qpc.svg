<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="110.0" y="8.0" width="480.0" height="62.0" rx="8" fill="#f1f2f4" stroke="#1d2330" stroke-width="1.4"/>
<text x="350.0" y="30.0" font-size="13" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">UN PROCÈS EN COURS</text>
<text x="350.0" y="50.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">une partie soutient qu'une <tspan font-weight="700">loi</tspan> porte atteinte</text>
<text x="350.0" y="66.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">aux <tspan font-weight="700">droits et libertés</tspan> que la Constitution garantit</text>
<line x1="350.0" y1="70.0" x2="350.0" y2="92.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="110.0" y="94.0" width="480.0" height="98.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="350.0" y="116.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">LE JUGE DU PROCÈS — 1er filtre</text>
<text x="350.0" y="136.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la loi est <tspan font-weight="700">applicable au litige</tspan> ;</text>
<text x="350.0" y="151.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">elle n'a <tspan font-weight="700">pas déjà été jugée conforme</tspan> ;</text>
<text x="350.0" y="166.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la question n'est <tspan font-weight="700">pas dépourvue de sérieux</tspan></text>
<text x="350.0" y="181.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">→ il transmet sans délai</text>
<line x1="270.0" y1="192.0" x2="190.0" y2="220.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<line x1="430.0" y1="192.0" x2="510.0" y2="220.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="40.0" y="222.0" width="290.0" height="68.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="185.0" y="244.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">CONSEIL D'ÉTAT</text>
<text x="185.0" y="264.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">ordre administratif — 2e filtre</text>
<text x="185.0" y="280.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">3 mois</tspan> : question <tspan font-weight="700">nouvelle</tspan> ou <tspan font-weight="700">sérieuse</tspan> ?</text>
<rect x="370.0" y="222.0" width="290.0" height="68.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="515.0" y="244.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">COUR DE CASSATION</text>
<text x="515.0" y="264.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">ordre judiciaire — 2e filtre</text>
<text x="515.0" y="280.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">3 mois</tspan> : question <tspan font-weight="700">nouvelle</tspan> ou <tspan font-weight="700">sérieuse</tspan> ?</text>
<line x1="185.0" y1="290.0" x2="300.0" y2="322.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<line x1="515.0" y1="290.0" x2="400.0" y2="322.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="170.0" y="324.0" width="360.0" height="50.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="350.0" y="346.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">CONSEIL CONSTITUTIONNEL</text>
<text x="350.0" y="366.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">3 mois</tspan> pour statuer (art. 61-1)</text>
<line x1="270.0" y1="374.0" x2="200.0" y2="400.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<line x1="430.0" y1="374.0" x2="500.0" y2="400.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="40.0" y="402.0" width="300.0" height="50.0" rx="8" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.4"/>
<text x="190.0" y="424.0" font-size="13" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">CONFORME</text>
<text x="190.0" y="444.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la loi continue de s'appliquer</text>
<rect x="360.0" y="402.0" width="300.0" height="50.0" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<text x="510.0" y="424.0" font-size="13" fill="#b3261e" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">NON CONFORME : ABROGATION</text>
<text x="510.0" y="444.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">immédiate ou différée, <tspan font-weight="700">pour tous</tspan> (art. 62)</text>
</svg>
