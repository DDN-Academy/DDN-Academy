<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 324" width="700" height="324">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="150.0" y="8.0" width="270.0" height="34.0" rx="6" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="285.0" y="30.0" font-size="12.5" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">POUVOIR CONSTITUANT ORIGINAIRE</text>
<rect x="430.0" y="8.0" width="270.0" height="34.0" rx="6" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
