<rect x="10.0" y="50.0" width="132.0" height="46.0" rx="6" fill="#f1f2f4" stroke="#6b7280" stroke-width="1"/>
<text x="76.0" y="78.0" font-size="12" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Ce qu'il fait</text>
<rect x="150.0" y="50.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="285.0" y="69.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">établir</tspan> une constitution</text>
<text x="285.0" y="85.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">nouvelle</text>
<rect x="430.0" y="50.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="565.0" y="69.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">réviser</tspan> la constitution</text>
<text x="565.0" y="85.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">en vigueur</text>
<rect x="10.0" y="104.0" width="132.0" height="46.0" rx="6" fill="#f1f2f4" stroke="#6b7280" stroke-width="1"/>
<text x="76.0" y="132.0" font-size="12" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Quand ?</text>
<rect x="150.0" y="104.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="285.0" y="123.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">révolution · guerre · effondrement</text>
<text x="285.0" y="139.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">d'un régime · naissance d'un État</text>
<rect x="430.0" y="104.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="565.0" y="123.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">pour <tspan font-weight="700">adapter</tspan> la constitution</text>
<text x="565.0" y="139.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">à l'évolution de la société</text>
<rect x="10.0" y="158.0" width="132.0" height="46.0" rx="6" fill="#f1f2f4" stroke="#6b7280" stroke-width="1"/>
<text x="76.0" y="186.0" font-size="12" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Comment ?</text>
<rect x="150.0" y="158.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="285.0" y="177.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">librement</tspan> : octroi, pacte,</text>
<text x="285.0" y="193.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">assemblée constituante, référendum</text>
<rect x="430.0" y="158.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="565.0" y="177.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">selon la <tspan font-weight="700">procédure prévue</tspan> :</text>
<text x="565.0" y="193.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">en France, l'<tspan font-weight="700">article 89</tspan></text>
<rect x="10.0" y="212.0" width="132.0" height="46.0" rx="6" fill="#f1f2f4" stroke="#6b7280" stroke-width="1"/>
<text x="76.0" y="240.0" font-size="12" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">Limites ?</text>
<rect x="150.0" y="212.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="285.0" y="231.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">aucune</tspan> :</text>
<text x="285.0" y="247.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">il est inconditionné</text>
<rect x="430.0" y="212.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="565.0" y="231.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">procédure</tspan>, <tspan font-weight="700">temps</tspan> (al. 4, art. 7),</text>
<text x="565.0" y="247.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">fond</tspan> (al. 5 : forme républicaine)</text>
<rect x="10.0" y="266.0" width="132.0" height="46.0" rx="6" fill="#f1f2f4" stroke="#6b7280" stroke-width="1"/>
<text x="76.0" y="294.0" font-size="12" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">En France</text>
<rect x="150.0" y="266.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
<text x="285.0" y="285.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">1791 · 1814 · 1830 · 1848 ·</text>
<text x="285.0" y="301.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">1875 · 1946 · <tspan font-weight="700">1958</tspan></text>
<rect x="430.0" y="266.0" width="270.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
