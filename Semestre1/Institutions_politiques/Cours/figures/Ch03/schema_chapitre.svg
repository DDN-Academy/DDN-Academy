<text x="350.0" y="230.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">la norme suprême de l'État</text>
<rect x="100.0" y="290.0" width="500.0" height="148.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="350.0" y="312.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">§ 3 — LA PROTECTION</text>
<text x="350.0" y="332.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">politique</tspan> : le Président (art. 5) — mais 1962 ; impeachment ; Haute Cour</text>
<text x="350.0" y="350.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">modèle américain</tspan> (Marbury, 1803) : diffus, a posteriori, concret, relatif</text>
<text x="350.0" y="368.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">modèle européen</tspan> (Kelsen, 1920) : concentré, a priori, abstrait, absolu</text>
<text x="350.0" y="386.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">France</tspan> : le Conseil constitutionnel ; la <tspan font-weight="700">QPC</tspan> (2008-2010) ajoute l'a posteriori</text>
<text x="350.0" y="404.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">→ l'<tspan font-weight="700">État de droit</tspan></text>
</svg>
