<rect x="8.0" y="10.0" width="318.0" height="170.0" rx="8" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.4"/>
<text x="167.0" y="32.0" font-size="13" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">§ 1 — LA NOTION</text>
<text x="167.0" y="52.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la <tspan font-weight="700">norme suprême</tspan> : Kelsen, la pyramide</text>
<text x="167.0" y="70.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">matérielle</tspan> : les règles sur le pouvoir</text>
<text x="167.0" y="88.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">formelle</tspan> : le texte à procédure spéciale</text>
<text x="167.0" y="106.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">écrite</tspan> ou <tspan font-weight="700">coutumière</tspan> (Royaume-Uni)</text>
<text x="167.0" y="124.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">coutume praeter legem ou contra legem</text>
<text x="167.0" y="142.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">souple</tspan> ou <tspan font-weight="700">rigide</tspan> (art. 89 ; art. V)</text>
<rect x="374.0" y="10.0" width="318.0" height="170.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="533.0" y="32.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">§ 2 — ÉLABORATION ET RÉVISION</text>
<text x="533.0" y="52.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">originaire</tspan> : créer — révolution, guerre,</text>
<text x="533.0" y="69.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">effondrement ; octroi, pacte, assemblée,</text>
<text x="533.0" y="86.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">référendum (1958), les deux (1946)</text>
<text x="533.0" y="103.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">dérivé</tspan> : réviser — art. 89 : projet ou</text>
<text x="533.0" y="120.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">proposition ; vote identique ; référendum</text>
<text x="533.0" y="137.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">ou Congrès (3/5) · limites : al. 4, al. 5</text>
<text x="533.0" y="154.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">25 révisions · 1962 : l'article 11</text>
