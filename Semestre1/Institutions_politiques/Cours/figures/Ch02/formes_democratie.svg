<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 312" width="700" height="312">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="8.0" y="10.0" width="220.0" height="250.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="118.0" y="34.0" font-size="12.5" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">DÉMOCRATIE DIRECTE</text>
<circle cx="78.0" cy="92.0" r="7.0" fill="#ffffff" stroke="#b35c00" stroke-width="1.2"/>
<circle cx="98.0" cy="92.0" r="7.0" fill="#ffffff" stroke="#b35c00" stroke-width="1.2"/>
<circle cx="118.0" cy="92.0" r="7.0" fill="#ffffff" stroke="#b35c00" stroke-width="1.2"/>
