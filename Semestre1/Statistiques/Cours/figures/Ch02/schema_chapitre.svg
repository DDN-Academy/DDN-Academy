<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450">
<rect x="0" y="0" width="780" height="450" fill="#ffffff"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="290.0" y="12.0" width="200.0" height="52.0" rx="8" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.4"/>
<text x="390.0" y="34.0" font-size="14" fill="#ffffff" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">RÉSUMER</text>
<text x="390.0" y="52.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">une distribution en quelques nombres</text>
<rect x="10.0" y="96.0" width="245.0" height="330.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="132.5" y="118.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">1. Position : où ?</text>
<text x="132.5" y="138.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">mode</tspan> : la plus fréquente</text>
<text x="132.5" y="165.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">classes : la plus forte densité</text>
<text x="132.5" y="192.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(d = f / a ; histogramme)</text>
<text x="132.5" y="219.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">moyenne</tspan> : 3 formules</text>
<text x="132.5" y="246.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">brutes · distribution · groupes</text>
<text x="132.5" y="273.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">linéaire, sensible aux extrêmes</text>
<text x="132.5" y="300.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">médiane</tspan> : F = 50 %</text>
<text x="132.5" y="327.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">rang central ou interpolation</text>
<text x="132.5" y="354.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">quantiles</tspan> Q1, Q3, D1, D9</text>
<text x="132.5" y="381.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">étalée à droite : méd &lt; moy</text>
<line x1="390.0" y1="64.0" x2="132.5" y2="94.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="267.0" y="96.0" width="245.0" height="330.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="389.5" y="118.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">2. Dispersion : comment ?</text>
<text x="389.5" y="138.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">étendue</tspan> : max − min</text>
<text x="389.5" y="165.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">D9 − D1</tspan>, <tspan font-weight="700">Q3 − Q1</tspan>, D9/D1</text>
<text x="389.5" y="192.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">boîte à moustaches</text>
<text x="389.5" y="219.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">EAM</tspan> = moyenne des |x − m|</text>
<text x="389.5" y="246.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">variance</tspan> σ² (Koenig)</text>
<text x="389.5" y="273.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">V(aX + b) = a² V(X)</text>
<text x="389.5" y="300.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">σ</tspan> dans l'unité de X</text>
<text x="389.5" y="327.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">CV</tspan> = σ / m, sans unité</text>
<text x="389.5" y="354.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">Tchebychev</tspan> : m ± kσ ⊃ 1 − 1/k²</text>
<text x="389.5" y="381.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">V = V intra + V inter</text>
<line x1="390.0" y1="64.0" x2="389.5" y2="94.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="524.0" y="96.0" width="245.0" height="330.0" rx="8" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.4"/>
<text x="646.5" y="118.0" font-size="13" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">3. Concentration : à qui ?</text>
<text x="646.5" y="138.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la <tspan font-weight="700">somme</tspan> de X se partage</text>
<text x="646.5" y="165.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">part de l'agrégat :</text>
<text x="646.5" y="192.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">effectif × moyenne / total</text>
<text x="646.5" y="219.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">courbe de Lorenz</tspan> :</text>
<text x="646.5" y="246.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">part cumulée de la masse</text>
<text x="646.5" y="273.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">selon la part cumulée des individus</text>
<text x="646.5" y="300.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">loin de la diagonale : inégal</text>
<text x="646.5" y="327.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">Gini</tspan> = 2 × aire de concentration</text>
<text x="646.5" y="354.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">= 1 − Σ (b + B) × h</text>
<text x="646.5" y="381.0" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">0 égalité · 1 concentration max.</text>
<line x1="390.0" y1="64.0" x2="646.5" y2="94.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
</svg>
