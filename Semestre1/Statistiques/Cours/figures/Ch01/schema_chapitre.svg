<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="280.0" y="14.0" width="200.0" height="52.0" rx="8" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.4"/>
<text x="380.0" y="36.0" font-size="14" fill="#ffffff" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">PRÉSENTER</text>
<text x="380.0" y="54.0" font-size="11" fill="#ffffff" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">sans perte d'information</text>
<rect x="14.0" y="100.0" width="232.0" height="128.0" rx="8" fill="#fdf0e0" stroke="#b35c00" stroke-width="1.4"/>
<text x="130.0" y="122.0" font-size="13" fill="#b35c00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">1. L'étude statistique</text>
<text x="130.0" y="142.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">6 étapes, guidées par</text>
<text x="130.0" y="161.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la problématique : problème,</text>
<text x="130.0" y="180.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">données, recueil, mesures,</text>
<text x="130.0" y="199.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">traitement, décision</text>
<line x1="380.0" y1="66.0" x2="130.0" y2="98.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="264.0" y="100.0" width="232.0" height="128.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="380.0" y="122.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">2. Le vocabulaire</text>
<text x="380.0" y="142.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">population · unité · N</text>
<text x="380.0" y="161.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">caractère X · modalités x</text>
<text x="380.0" y="180.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">quali. nominal / ordinal</text>
<text x="380.0" y="199.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">quanti. discret / continu</text>
<line x1="380.0" y1="66.0" x2="380.0" y2="98.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="514.0" y="100.0" width="232.0" height="128.0" rx="8" fill="#e6f2e7" stroke="#2e7d32" stroke-width="1.4"/>
<text x="630.0" y="122.0" font-size="13" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">3. La distribution</text>
<text x="630.0" y="142.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">série brute → trier → compter</text>
<text x="630.0" y="161.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">effectif n · fréquence f = n / N</text>
<text x="630.0" y="180.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">fréq. cumulée F = « ou moins »</text>
<text x="630.0" y="199.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Σ n = N · Σ f = 1</text>
<line x1="380.0" y1="66.0" x2="630.0" y2="98.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="14.0" y="262.0" width="360.0" height="124.0" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.4"/>
<text x="194.0" y="284.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">4. Représenter une distribution</text>
<text x="194.0" y="304.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">colonnes ou barres (quali., quanti. discret)</text>
<text x="194.0" y="323.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">camembert : angle = f × 360°</text>
<text x="194.0" y="342.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">fréquences cumulées : diagramme en escalier</text>
<text x="194.0" y="361.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">une phrase de lecture sous chaque tableau</text>
<rect x="392.0" y="262.0" width="354.0" height="124.0" rx="8" fill="#f1f2f4" stroke="#1d2330" stroke-width="1.4"/>
<text x="569.0" y="284.0" font-size="13" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">5. Comparer des sous-populations</text>
<text x="569.0" y="304.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">colonnes groupées : par catégorie</text>
<text x="569.0" y="323.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(évolution) ou par année (structure)</text>
<text x="569.0" y="342.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">empilées : les totaux</text>
<text x="569.0" y="361.0" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">empilées à 100 % : les structures</text>
<line x1="630.0" y1="230.0" x2="569.0" y2="260.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
<line x1="630.0" y1="230.0" x2="194.0" y2="260.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#fl)"/>
</svg>
