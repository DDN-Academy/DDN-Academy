      '<div class="scroll-x"><table class="tbl"><thead><tr><th>N°</th><th>Zone</th><th class="num">Cap. min</th><th class="num">Cap. max</th><th>Active</th><th class="actions"></th></tr></thead><tbody>' +
      p.tables.map(t =>
        '<tr><td><b>' + t.numero + '</b></td>' +
        '<td><label class="sro" for="tz' + t.id + '">Zone de la table ' + t.numero + '</label><select class="in" id="tz' + t.id + '" data-tzone="' + t.id + '" style="min-height:38px;padding:5px 26px 5px 8px;width:130px">' +
        p.zones.map(z => '<option value="' + z.id + '"' + (t.zoneId === z.id ? ' selected' : '') + '>' + e(z.nom) + '</option>').join('') + '</select></td>' +
        '<td class="num"><label class="sro" for="tmin' + t.id + '">Capacité minimum table ' + t.numero + '</label><input class="in" id="tmin' + t.id + '" data-tcap="min" data-tid="' + t.id + '" type="number" min="1" value="' + t.capMin + '" style="width:70px;min-height:38px;padding:5px 8px;text-align:right"></td>' +
        '<td class="num"><label class="sro" for="tmax' + t.id + '">Capacité maximum table ' + t.numero + '</label><input class="in" id="tmax' + t.id + '" data-tcap="max" data-tid="' + t.id + '" type="number" min="1" value="' + t.capMax + '" style="width:70px;min-height:38px;padding:5px 8px;text-align:right"></td>' +
        '<td><label class="sw"><input type="checkbox" data-tact="' + t.id + '"' + (t.active ? ' checked' : '') + ' aria-label="Table ' + t.numero + ' active"><span class="piste"></span></label></td>' +
        '<td class="actions"><button class="btn btn-g btn-ico btn-s" data-tsup="' + t.id + '" aria-label="Supprimer la table ' + t.numero + '">' + ic('corb') + '</button></td></tr>').join('') +
      '</tbody></table></div>' +
      '<div style="margin-top:10px"><button class="btn" id="tAdd">' + ic('plus') + ' Ajouter une table</button></div>' +
      '</div>' +

      '<div class="card"><h3>' + ic('carte') + ' Coordonnées et textes</h3>' +
      [['nom', 'Nom du restaurant'], ['slogan', 'Slogan'], ['adresse', 'Adresse'], ['tel', 'Téléphone'], ['email', 'Email'], ['instagram', 'Instagram'], ['facebook', 'Facebook']].map(x =>
        '<div class="champ"><label class="lab" for="rs-' + x[0] + '">' + x[1] + '</label><input class="in" id="rs-' + x[0] + '" data-resto="' + x[0] + '" value="' + e(p.restaurant[x[0]]) + '"></div>').join('') +
      '<div class="sep"></div>' +
      '<div class="champ"><label class="lab" for="rgCode">Code d\'accès de l\'espace équipe</label><div style="display:flex;gap:8px">' +
      '<input class="in" id="rgCode" value="' + e(p.parametres.code) + '" autocomplete="off" style="max-width:140px"><button class="btn" id="rgCodeBtn">Changer le code</button></div></div>' +
      '</div>' +

      '<div class="card"><h3>' + ic('dl') + ' Données</h3>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn" id="rgExp">' + ic('dl') + ' Exporter (JSON)</button>' +
      '<button class="btn" id="rgImpBtn">' + ic('up') + ' Importer un fichier</button>' +
      '<input type="file" accept="application/json,.json" id="rgImp" class="sro" aria-label="Fichier de données à importer">' +
      '<button class="btn btn-d" id="rgReset">' + ic('refresh') + ' Réinitialiser la démonstration</button>' +
      '</div>' +
      '<div class="sep"></div><h3 style="margin-bottom:8px">Journal des actions</h3>' +
      '<div style="max-height:340px;overflow-y:auto">' +
      (p.journal.length ? p.journal.slice(0, 100).map(j => {
        const dt = new Date(j.ts);
        return '<div class="journal-lig"><time datetime="' + dt.toISOString() + '">' + D.pad(dt.getDate()) + '/' + D.pad(dt.getMonth() + 1) + ' ' + D.pad(dt.getHours()) + ':' + D.pad(dt.getMinutes()) + '</time><span class="jq">' + e(j.qui) + '</span><span>' + e(sansTiret(j.quoi)) + '</span></div>';
      }).join('') : '<p class="vide">Journal vide.</p>') +
      '</div></div>' +
      '</div>';
    brancheReglages();
  }
};
function brancheReglages() {
  const sauve = (msg) => { D.save(); if (msg) toast(msg); };
  $$('#rgTout [data-svc]').forEach(inp => inp.addEventListener('change', () => {
    const s = D.db.services.find(x => x.id === inp.dataset.svc);
    if (!inp.value) { inp.value = s[inp.dataset.ch]; return; }
    s[inp.dataset.ch] = inp.value;
    D.log('Horaires modifiés : ' + s.nom);
    sauve('Horaires mis à jour. Créneaux du site client actualisés.');
  }));
  $$('#rgTout [data-svcj]').forEach(inp => inp.addEventListener('change', () => {
    const s = D.db.services.find(x => x.id === inp.dataset.svcj);
    const j = +inp.dataset.jour;
    s.jours = inp.checked ? s.jours.concat(j).sort() : s.jours.filter(x => x !== j);
    D.log('Jours d\'ouverture modifiés : ' + s.nom);
    sauve('Jours d\'ouverture mis à jour.');
  }));
  $('#fmAdd').addEventListener('click', () => {
    const date = $('#fmDate').value, raison = $('#fmRaison').value.trim();
    if (!date || !raison) { toast('Indiquez la date et la raison.', true); return; }
    if (D.estFerme(date)) { toast('Une fermeture existe déjà à cette date.', true); return; }
    D.db.fermetures.push({ id: D.uid(), date, raison, message: $('#fmMsg').value.trim() });
    D.log('Fermeture ajoutée : ' + D.fmtShort(date) + ' (' + raison + ')');
    sauve('Fermeture du ' + D.fmtShort(date) + ' enregistrée.');
  });
  $$('#rgTout [data-fsup]').forEach(b => b.addEventListener('click', () => {
    const f = D.db.fermetures.find(x => x.id === b.dataset.fsup);
    confirmer('Supprimer la fermeture', 'Rouvrir le <b>' + e(D.fmtShort(f.date)) + '</b> (' + e(f.raison) + ') ?', 'Rouvrir ce jour', () => {
      avecAnnulation('Fermeture du ' + D.fmtShort(f.date) + ' supprimée', () => {
        D.db.fermetures = D.db.fermetures.filter(x => x.id !== f.id);
        D.log('Fermeture supprimée : ' + D.fmtShort(f.date));
        D.save();
      });
    });
  }));
  $$('#rgTout [data-znom]').forEach(inp => inp.addEventListener('change', () => {
    const z = D.db.zones.find(x => x.id === inp.dataset.znom);
    if (!inp.value.trim()) { inp.value = z.nom; return; }
    D.log('Zone renommée : ' + z.nom + ' en ' + inp.value.trim());
    z.nom = inp.value.trim();
    sauve('Zone renommée.');
  }));
  $$('#rgTout [data-zact]').forEach(inp => inp.addEventListener('change', () => basculeZone(inp.dataset.zact)));
  $$('#rgTout [data-duree]').forEach(inp => inp.addEventListener('change', () => {
    const v = Math.max(30, +inp.value || 90);
    D.db.regles.durees[inp.dataset.duree] = v;
    D.log('Durée d\'occupation modifiée');
    sauve('Durées mises à jour.');
  }));
  $$('#rgTout [data-regle]').forEach(inp => inp.addEventListener('change', () => {
    D.db.regles[inp.dataset.regle] = Math.max(0, +inp.value || 0);
    D.log('Règle modifiée : ' + inp.dataset.regle);
    sauve('Règle mise à jour. Créneaux du site client actualisés.');
  }));
  $$('#rgTout [data-tzone]').forEach(sel => sel.addEventListener('change', () => {
    const t = D.db.tables.find(x => x.id === sel.dataset.tzone);
    t.zoneId = sel.value;
    D.log('Table ' + t.numero + ' déplacée de zone');
    sauve('Table ' + t.numero + ' changée de zone.');
  }));
  $$('#rgTout [data-tcap]').forEach(inp => inp.addEventListener('change', () => {
    const t = D.db.tables.find(x => x.id === inp.dataset.tid);
    const v = Math.max(1, +inp.value || 1);
    if (inp.dataset.tcap === 'min') t.capMin = Math.min(v, t.capMax); else t.capMax = Math.max(v, t.capMin);
    D.log('Capacité de la table ' + t.numero + ' modifiée');
    sauve('Capacité de la table ' + t.numero + ' mise à jour.');
  }));
  $$('#rgTout [data-tact]').forEach(inp => inp.addEventListener('change', () => {
    const t = D.db.tables.find(x => x.id === inp.dataset.tact);
    t.active = inp.checked;
    D.log('Table ' + t.numero + (t.active ? ' réactivée' : ' désactivée'));
    sauve('Table ' + t.numero + (t.active ? ' réactivée.' : ' désactivée.'));
  }));
  $$('#rgTout [data-tsup]').forEach(b => b.addEventListener('click', () => {
    const t = D.db.tables.find(x => x.id === b.dataset.tsup);
    const concernees = D.db.reservations.filter(r => r.date >= D.todayISO() && !['annulee', 'absence', 'terminee'].includes(r.statut) && r.tableIds.includes(t.id));
    confirmer('Supprimer la table ' + t.numero,
      'Supprimer définitivement la table <b>' + t.numero + '</b> ?' +
      (concernees.length ? '<br><b style="color:var(--accent-t)">' + concernees.length + ' réservation' + (concernees.length > 1 ? 's' : '') + ' à venir y ' + (concernees.length > 1 ? 'sont placées' : 'est placée') + '</b> : elles repasseront « à placer ».' : ''),
      'Supprimer la table', () => {
        avecAnnulation('Table ' + t.numero + ' supprimée', () => {
          concernees.forEach(r => { r.tableIds = []; });
          D.db.tables = D.db.tables.filter(x => x.id !== t.id);
          D.db.tables.forEach(x => { x.combinable = (x.combinable || []).filter(id => id !== t.id); });
          D.log('Table supprimée : ' + t.numero);
          D.save();
        });
      });
  }));
  $('#tAdd').addEventListener('click', () => {
    const num = Math.max(0, ...D.db.tables.map(t => t.numero)) + 1;
    const m = ouvreModal(
      mTete('Ajouter la table ' + num) +
      '<form id="fTA"><div class="m-corps"><div class="grille3">' +
      '<div class="champ"><label class="lab" for="taZone">Zone</label><select class="in" id="taZone">' +
      D.db.zones.map(z => '<option value="' + z.id + '">' + e(z.nom) + '</option>').join('') + '</select></div>' +
      '<div class="champ"><label class="lab" for="taMin">Cap. min</label><input class="in" id="taMin" type="number" min="1" value="2"></div>' +
      '<div class="champ"><label class="lab" for="taMax">Cap. max</label><input class="in" id="taMax" type="number" min="1" value="4"></div>' +
      '</div><p style="font-size:12px;color:var(--muted)">La table apparaîtra au centre de sa zone : glissez-la ensuite à sa place sur le plan.</p>' +
      '</div><div class="m-pied"><button class="btn" type="button" data-ferme>Annuler</button>' +
      '<button class="btn btn-p" type="submit">Ajouter</button></div></form>'
    );
    m.querySelector('#fTA').addEventListener('submit', ev => {
      ev.preventDefault();
      const capMin = Math.max(1, +m.querySelector('#taMin').value || 1);
      const capMax = Math.max(capMin, +m.querySelector('#taMax').value || capMin);
      D.db.tables.push({ id: 't' + D.uid(), numero: num, zoneId: m.querySelector('#taZone').value, capMin, capMax, x: 50, y: 50, active: true, combinable: [] });
      D.log('Table ajoutée : ' + num);
      D.save();
      fermeModal();
      toast('Table ' + num + ' ajoutée. Positionnez-la sur le plan.');
    });
  });
  $$('#rgTout [data-resto]').forEach(inp => inp.addEventListener('change', () => {
    D.db.restaurant[inp.dataset.resto] = inp.value.trim();
    D.log('Coordonnées mises à jour : ' + inp.dataset.resto);
    sauve('Coordonnées mises à jour sur le site client.');
  }));
  $('#rgCodeBtn').addEventListener('click', () => {
    const v = $('#rgCode').value.trim();
    if (v.length < 4) { toast('Le code doit faire au moins 4 caractères.', true); return; }
    D.db.parametres.code = v;
    D.log('Code d\'accès modifié');
    sauve('Nouveau code d\'accès enregistré.');
  });
  $('#rgExp').addEventListener('click', () => {
    dlFichier('directoire-donnees-' + D.todayISO() + '.json', D.exporte(), 'application/json');
    D.log('Export des données');
    toast('Sauvegarde JSON téléchargée.');
  });
  $('#rgImpBtn').addEventListener('click', () => $('#rgImp').click());
  $('#rgImp').addEventListener('change', () => {
    const f = $('#rgImp').files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      confirmer('Importer des données', 'Remplacer <b>toutes les données actuelles</b> par le contenu de « ' + e(f.name) + ' » ?', 'Importer', () => {
        avecAnnulation('Données importées depuis ' + f.name, () => {
          const r = D.importe(fr.result);
          if (!r.ok) toast(r.msg, true); else { D.log('Import de données : ' + f.name); D.save(); toast('Données importées.'); }
        });
      });
      $('#rgImp').value = '';
    };
    fr.readAsText(f);
  });
  $('#rgReset').addEventListener('click', () => {
    confirmer('Réinitialiser la démonstration', 'Toutes les données (réservations, carte, photos, clients) seront <b>remplacées par le jeu de démonstration</b>. Pensez à exporter avant si besoin.', 'Tout réinitialiser', () => {
      avecAnnulation('Démonstration réinitialisée', () => D.reinitialise());
      toast('Démonstration réinitialisée.');
    });
  });
  rendMiniPlan();
}
function rendMiniPlan() {
  $('#rgMiniPlan').innerHTML = D.db.zones.map(z => {
    const tz = D.db.tables.filter(t => t.zoneId === z.id);
    return '<section class="zone-plan"><div class="zone-tete"><h3>' + e(z.nom) + '</h3></div>' +
      '<div class="plan-fond" data-mz="' + z.id + '">' +
      tz.map(t => {
        const c = t.capMax, w = c <= 2 ? 48 : c <= 4 ? 64 : c <= 6 ? 82 : 96, h = c <= 2 ? 48 : c <= 4 ? 54 : c <= 6 ? 60 : 64;
        return '<div class="table-el' + (c <= 2 ? ' ronde' : '') + (t.active ? '' : ' et-nettoyage') + '" data-mt="' + t.id + '" style="left:' + t.x + '%;top:' + t.y + '%;width:' + w + 'px;height:' + h + 'px" tabindex="0" role="button" aria-label="Déplacer la table ' + t.numero + '">' +
        '<span class="t-num">' + t.numero + '</span><span class="t-cap">' + t.capMax + ' pl.</span></div>';
      }).join('') + '</div></section>';
  }).join('');
  $$('#rgMiniPlan [data-mt]').forEach(el2 => {
    el2.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      const t = D.db.tables.find(x => x.id === el2.dataset.mt);
      const fond = el2.parentElement, rect = fond.getBoundingClientRect();
      el2.setPointerCapture(ev.pointerId);
      let bougee = false;
      const move = mv => {
        bougee = true;
        const x = Math.min(94, Math.max(6, (mv.clientX - rect.left) / rect.width * 100));
        const y = Math.min(88, Math.max(10, (mv.clientY - rect.top) / rect.height * 100));
        el2.style.left = x + '%'; el2.style.top = y + '%';
        el2.dataset.nx = x.toFixed(1); el2.dataset.ny = y.toFixed(1);
      };
      const fin = () => {
        el2.removeEventListener('pointermove', move);
        el2.removeEventListener('pointerup', fin);
        el2.removeEventListener('pointercancel', fin);
        if (bougee && el2.dataset.nx) {
          t.x = +el2.dataset.nx; t.y = +el2.dataset.ny;
          D.log('Table ' + t.numero + ' repositionnée sur le plan');
          D.save();
          toast('Position de la table ' + t.numero + ' enregistrée.');
        }
      };
      el2.addEventListener('pointermove', move);
      el2.addEventListener('pointerup', fin);
      el2.addEventListener('pointercancel', fin);
    });
  });
}

/* ═══════ AMORÇAGE ═══════ */
D.init();
construitNav();
let themeInit = 'sombre';
try { themeInit = localStorage.getItem('directoire.theme') || 'sombre'; } catch (er) { }
appliqueTheme(themeInit);
$('#btnBurger').innerHTML = ic('burger');
$('#btnBurger').addEventListener('click', () => { $('#lat').classList.contains('ouvert') ? fermeLat() : ouvreLat(); });
$('#voileLat').addEventListener('click', fermeLat);
$('#btnTheme').addEventListener('click', () => appliqueTheme(document.documentElement.dataset.theme === 'sombre' ? 'clair' : 'sombre'));
$('#lienSite').innerHTML = ic('ext') + '<span>Site client</span>';
$('#btnSortir').innerHTML = ic('sortir') + '<span>Verrouiller l\'écran</span>';
$('#btnSortir').addEventListener('click', () => {
  sessionStorage.removeItem('directoire.auth');
  auth = false;
  $('#app').classList.remove('on');
  $('#ecranCode').style.display = 'flex';
  $('#inCode').value = '';
  setTimeout(() => $('#inCode').focus(), 50);
});
function demarre() {
  auth = true;
  $('#ecranCode').style.display = 'none';
  $('#app').classList.add('on');
  majBadges();
  ouvre('service');
}
$('#formCode').addEventListener('submit', ev => {
  ev.preventDefault();
  if ($('#inCode').value.trim() === String(D.db.parametres.code)) {
    try { sessionStorage.setItem('directoire.auth', '1'); } catch (er) { }
    $('#codeErr').textContent = '';
    demarre();
  } else {
    $('#codeErr').textContent = 'Code incorrect. Réessayez.';
    $('#inCode').value = '';
    $('#inCode').focus();
  }
});
D.onChange(() => { if (auth) { majBadges(); rafraichir(); } });
setInterval(() => {
  if (!auth) return;
  majBadges();
  if (!pileModales.length && ['service', 'plan'].includes(S.vue)) rafraichir();
}, 20000);
if (sessionStorage.getItem('directoire.auth') === '1') demarre();
else setTimeout(() => $('#inCode').focus(), 80);
</script>
