<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0E11">
<title>Le Directoire, espace équipe</title>
<style>
:root{
  --bg:#0E0E11; --card:#17171C; --card2:#1F1F26; --line:#2A2A33;
  --ink:#F2F0EC; --mut:#9A9AA6; --faint:#6E6E7A;
  --rouge:#E0263F; --or:#D9A94A; --vert:#4FA97B; --bleu:#4B8FD0;
  --r:16px; --tap:52px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-t="clair"]{
  --bg:#F4F4F6; --card:#FFFFFF; --card2:#EDEDF1; --line:#DEDEE5;
  --ink:#15151A; --mut:#5E5E6B; --faint:#8A8A96;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.nb{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--or);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}

#app{display:flex;flex-direction:column;min-height:100dvh}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:12px;color:var(--mut);font-weight:500;display:block;margin-top:1px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;border:1px solid var(--line)}
.ico svg{width:20px;height:20px}
main{flex:1;padding:16px 16px 120px;max-width:900px;width:100%;margin:0 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
  border-radius:12px;color:var(--faint);font-size:11px;font-weight:600;min-height:var(--tap);position:relative}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--rouge)}
.tabs .pt{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;
  background:var(--rouge);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;
  justify-content:center;padding:0 5px}
@media (min-width:840px){
  .tabs{max-width:880px;left:50%;transform:translateX(-50%);bottom:14px;border-radius:18px;
    border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.4)}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.card h2 .n2{font-size:13px;color:var(--mut);font-weight:700}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  text-align:center;line-height:1.25;min-height:96px;justify-content:center;transition:transform .15s}
.act:active{transform:scale(.96)}
.act svg{width:26px;height:26px;color:var(--rouge)}
.act.pri{background:var(--rouge);border-color:var(--rouge);color:#fff}
.act.pri svg{color:#fff}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.st .v{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.st .k{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:5px;text-transform:uppercase;letter-spacing:.06em}
.st .bar{height:5px;border-radius:3px;background:var(--card2);margin-top:9px;overflow:hidden}
.st .bar i{display:block;height:100%;background:var(--vert);border-radius:3px}
.st.al .v{color:var(--rouge)}

.ligne{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.ligne:last-child{border-bottom:none;padding-bottom:0}
.ligne:first-child{padding-top:0}
.heure{font-size:19px;font-weight:800;width:52px;flex:0 0 auto}
.qui{flex:1;min-width:0}
.qui .n{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qui .d{font-size:12.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:0 14px;height:42px;
  font-size:13.5px;font-weight:700;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
.bt svg{width:16px;height:16px}
.bt.ok{background:var(--vert);border-color:var(--vert);color:#06180F}
.bt.r{background:var(--rouge);border-color:var(--rouge);color:#fff}
.bt:active{transform:scale(.95)}
.puce{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:20px;text-transform:uppercase;
  letter-spacing:.05em;border:1px solid;white-space:nowrap}
.p-or{color:var(--or);border-color:color-mix(in srgb,var(--or) 50%,transparent)}
.p-r{color:var(--rouge);border-color:color-mix(in srgb,var(--rouge) 50%,transparent);
  background:color-mix(in srgb,var(--rouge) 12%,transparent)}
.p-v{color:var(--vert);border-color:color-mix(in srgb,var(--vert) 50%,transparent)}
.p-b{color:var(--bleu);border-color:color-mix(in srgb,var(--bleu) 50%,transparent)}
.p-g{color:var(--mut);border-color:var(--line)}

.al-b{display:flex;gap:11px;align-items:flex-start;background:color-mix(in srgb,var(--rouge) 11%,var(--card));
  border:1px solid color-mix(in srgb,var(--rouge) 32%,transparent);border-radius:13px;padding:12px 14px;margin-bottom:10px}
.al-b svg{width:19px;height:19px;color:var(--rouge);flex:0 0 auto;margin-top:1px}
.al-b b{display:block;font-size:14px}
.al-b span{font-size:13px;color:var(--mut)}
.al-b.or{background:color-mix(in srgb,var(--or) 11%,var(--card));border-color:color-mix(in srgb,var(--or) 32%,transparent)}
.al-b.or svg{color:var(--or)}

.vide{text-align:center;padding:34px 16px;color:var(--mut);font-size:14.5px;line-height:1.6}
.vide svg{width:34px;height:34px;color:var(--faint);margin-bottom:10px}

.aide{background:color-mix(in srgb,var(--bleu) 12%,var(--card));border:1px solid color-mix(in srgb,var(--bleu) 30%,transparent);
  border-radius:13px;padding:12px 14px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.aide svg{width:19px;height:19px;color:var(--bleu);flex:0 0 auto}
.zt{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:13px;font-weight:800;
  text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.zt .sp{flex:1;height:1px;background:var(--line)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.tbl{aspect-ratio:1;border-radius:15px;background:var(--card);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:800;font-size:21px;position:relative;padding:6px;transition:transform .15s}
.tbl small{font-size:10.5px;font-weight:700;color:var(--mut);text-align:center;line-height:1.15}
.tbl:active{transform:scale(.94)}
.tbl.libre{border-style:dashed}
.tbl.res{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 15%,var(--card))}
.tbl.inst{border-color:var(--vert);background:color-mix(in srgb,var(--vert) 15%,var(--card))}
.tbl.res small,.tbl.inst small{color:var(--ink)}
.tbl.cible{border-color:var(--or);box-shadow:0 0 0 4px color-mix(in srgb,var(--or) 30%,transparent)}
.tbl .ch{position:absolute;top:5px;right:6px;font-size:9.5px;font-weight:800;color:var(--mut)}
.tbl .ch.long{color:var(--rouge)}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;
  background:var(--or);color:#1A1206;border-radius:14px;padding:13px 16px;display:flex;align-items:center;
  gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:700;font-size:14px}
.selbar .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar button{background:rgba(0,0,0,.18);border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px;color:inherit}
@media (min-width:840px){.selbar{max-width:520px;left:50%;right:auto;transform:translateX(-50%)}}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:4px;border:2px solid;margin-right:5px;vertical-align:-1px}

.plat{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.plat:last-child{border-bottom:none}
.plat.off{opacity:.45}
.plat .info{flex:1;min-width:0}
.plat .nom{font-weight:700;font-size:15.5px}
.plat .des{font-size:12.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prix{background:var(--card2);border:1px solid var(--line);border-radius:10px;height:44px;width:76px;
  text-align:center;font-weight:800;font-size:15px;flex:0 0 auto}
.prix:focus{border-color:var(--rouge);outline:none;background:var(--card)}

.voile{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.voile{align-items:center}}
.feuille{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;
  animation:monte .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.feuille{border-radius:20px;animation:none}}
@keyframes monte{from{transform:translateY(100%)}to{transform:none}}
.poignee{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.feuille h3{font-size:19px;margin-bottom:4px}
.feuille .ss{font-size:13.5px;color:var(--mut);margin:0 0 16px}
.champ{margin-bottom:13px}
.champ label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.06em}
.champ input,.champ select,.champ textarea{width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;min-height:var(--tap)}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--rouge);outline:none}
.champ .at{font-size:12px;color:var(--faint);margin-top:5px}
.gros{width:100%;background:var(--rouge);color:#fff;border-radius:14px;min-height:54px;
  font-size:16px;font-weight:800;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.gros.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.gros:active{transform:scale(.98)}
.rang{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 15px;
  font-size:14.5px;font-weight:700;min-height:46px}
.opt.on{background:var(--rouge);border-color:var(--rouge);color:#fff}

.ml{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;width:100%;text-align:left;min-height:var(--tap)}
.ml>svg:first-child{width:22px;height:22px;color:var(--rouge);flex:0 0 auto}
.ml .t{flex:1;min-width:0}
.ml .t b{display:block;font-size:15.5px}
.ml .t span{font-size:12.5px;color:var(--mut)}
.ml .fl{width:17px;height:17px;color:var(--faint);flex:0 0 auto}

.rech{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;min-height:var(--tap);margin-bottom:12px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 15px;
  font-size:13.5px;font-weight:700;white-space:nowrap;flex:0 0 auto;min-height:42px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:70;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  transform:translateY(160%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{transform:none}
.toast .sp{flex:1}
.toast button{color:var(--rouge);font-weight:800;font-size:14px}
@media (min-width:840px){.toast{max-width:520px;left:50%;right:auto;transform:translate(-50%,160%)}
  .toast.on{transform:translate(-50%,0)}}
.cache{display:none!important}

.porte{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.porte .b{width:100%;max-width:340px;text-align:center}
.porte .lg{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--rouge);margin-bottom:10px}
.porte h1{font-size:26px;margin-bottom:6px}
.porte p{color:var(--mut);font-size:14.5px;margin:0 0 24px}
.porte input{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:18px;text-align:center;font-size:26px;font-weight:800;letter-spacing:.5em;text-indent:.5em}
.porte input:focus{border-color:var(--rouge);outline:none}
.porte .er{color:var(--rouge);font-size:14px;font-weight:600;margin-top:12px;min-height:20px}

.visite{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:24px}
.visite .b{background:var(--card);border-radius:22px;padding:28px 24px;max-width:380px;width:100%;text-align:center}
.visite .num{width:52px;height:52px;border-radius:26px;background:var(--rouge);color:#fff;font-size:22px;
  font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.visite h3{font-size:20px;margin-bottom:8px}
.visite p{color:var(--mut);font-size:15px;margin-bottom:22px;line-height:1.55}
.visite .pts{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.visite .pts i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.visite .pts i.on{background:var(--rouge);width:22px}
.apercu{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--card2);margin-bottom:12px}
.apercu img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="app"></div>
<div id="couche"></div>
<div class="toast" id="toast"><span class="sp" id="toast-t"></span><button id="toast-b" class="cache">Rétablir</button></div>

const S={vue:'soir',auth:false,sel:null,date:null,q:'',filtre:'tous',sous:null};
const K_VIS='directoire.visite.v2', K_TH='directoire.theme';
let mToast=null;

function toast(msg,undo){
  const t=$('#toast'), b=$('#toast-b');
  $('#toast-t').textContent=msg;
  b.classList.toggle('cache',!undo);
  if(undo) b.onclick=()=>{ undo(); t.classList.remove('on'); rendre(); };
  t.classList.add('on');
  clearTimeout(mToast);
  mToast=setTimeout(()=>t.classList.remove('on'), undo?7000:3200);
}
function feuille(html,apres){
  const c=$('#couche');
  c.innerHTML='<div class="voile"><div class="feuille" role="dialog" aria-modal="true"><div class="poignee"></div>'+html+'</div></div>';
  const v=$('.voile',c);
  v.onclick=e=>{ if(e.target===v) fermer(); };
  document.body.style.overflow='hidden';
  if(apres) apres(c);
}
function fermer(){ $('#couche').innerHTML=''; document.body.style.overflow=''; }
function confirmer(titre,texte,lib,action){
  feuille(`<h3>${E(titre)}</h3><p class="ss">${E(texte)}</p>
    <button class="gros" id="c-ok">${E(lib)}</button>
    <button class="gros sec" id="c-non">Retour</button>`, c=>{
    $('#c-ok',c).onclick=()=>{ fermer(); action(); };
    $('#c-non',c).onclick=fermer;
  });
}
const resasDu=d=>D.db.reservations.filter(r=>r.date===d).sort((a,b)=>a.heure.localeCompare(b.heure));
function chrono(r){ if(!r.assiseA) return null;
  const m=Math.round((Date.now()-r.assiseA)/60000);
  return {m, long:m>D.duree(r.couverts)}; }

function visite(){
  if(localStorage.getItem(K_VIS)) return;
  const pas=[
    ['1','Les réservations arrivent ici','Dès qu\'un client réserve sur votre site, sa table apparaît dans « Ce soir », en direct.'],
    ['2','Installez vos clients','Dans « Salle », touchez une réservation puis une table. C\'est tout.'],
    ['3','Un plat épuisé ?','Dans « Carte », un seul bouton. Le plat disparaît aussitôt du site client.']
  ];
  let i=0;
  const aff=()=>{
    const c=$('#couche');
    c.innerHTML=`<div class="visite"><div class="b">
      <div class="num">${pas[i][0]}</div><h3>${pas[i][1]}</h3><p>${pas[i][2]}</p>
      <div class="pts">${pas.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <button class="gros" id="v-s">${i<pas.length-1?'Suivant':'C\'est parti'}</button>
      ${i<pas.length-1?'<button class="gros sec" id="v-p">Passer</button>':''}</div></div>`;
    document.body.style.overflow='hidden';
    $('#v-s',c).onclick=()=>{ i++; i<pas.length?aff():fin(); };
    const p=$('#v-p',c); if(p) p.onclick=fin;
  };
  const fin=()=>{ localStorage.setItem(K_VIS,'1'); fermer(); };
  aff();
}

function coque(titre,sous,contenu,retour){
  const badge=D.db.attente.length;
  const tabs=[['soir','Ce soir',I.soir],['salle','Salle',I.salle],['carte','Carte',I.carte],['plus','Plus',I.plus]];
  $('#app').innerHTML=`
    <div class="top">
      ${retour?`<button class="ico" id="retour" aria-label="Retour">${I.ret}</button>`:''}
      <h1>${E(titre)}${sous?`<span class="sub">${E(sous)}</span>`:''}</h1>
      <button class="ico" id="theme" aria-label="Changer le thème">${I.sol}</button>
    </div>
    <main>${contenu}</main>
    <nav class="tabs">${tabs.map(([k,l,ic])=>`
      <button data-v="${k}" class="${S.vue===k?'on':''}">${ic}<span>${l}</span>
      ${k==='plus'&&badge?`<span class="pt nb">${badge}</span>`:''}</button>`).join('')}</nav>`;
  $$('.tabs button').forEach(b=>b.onclick=()=>{ S.vue=b.dataset.v; S.sous=null; S.sel=null; S.q=''; scrollTo(0,0); rendre(); });
  const rb=$('#retour'); if(rb) rb.onclick=()=>{ S.sous=null; S.q=''; rendre(); };
  $('#theme').onclick=()=>{
    const n=document.documentElement.dataset.t==='clair'?'':'clair';
    document.documentElement.dataset.t=n; localStorage.setItem(K_TH,n);
  };
}

/* ═══ CE SOIR ═══ */
function vSoir(){
  const d=D.todayISO();
  const rs=resasDu(d).filter(r=>r.statut!=='annulee');
  const cv=rs.filter(r=>r.statut!=='absence').reduce((s,r)=>s+r.couverts,0);
  const cap=D.capaciteTotale();
  const mnt=new Date().getHours()*60+new Date().getMinutes();
  const att=rs.filter(r=>['confirmee','attente'].includes(r.statut));
  const ret=att.filter(r=>D.hm2min(r.heure)<mnt-20);
  const suite=att.filter(r=>D.hm2min(r.heure)>=mnt-20).slice(0,10);
  const salle=rs.filter(r=>['arrivee','installee'].includes(r.statut));
  const ferm=D.estFerme(d);

  const alertes=[];
  rs.forEach(r=>{ const g=D.guest(r.guestId); const a=(r.allergies||g.allergies||'');
    if(a.toLowerCase().includes('sévère')) alertes.push(['r','Allergie sévère',g.nom+' à '+r.heure+', '+a]);
    else if(g.tags.includes('VIP')) alertes.push(['or','Client VIP',g.nom+' à '+r.heure+', '+g.visites+' visites']);
    else if(r.couverts>=6) alertes.push(['or','Groupe de '+r.couverts,g.nom+' à '+r.heure]);
  });

  const lg=r=>{
    const g=D.guest(r.guestId), vip=g.tags.includes('VIP'), alg=(r.allergies||g.allergies);
    const t=D.tableNom(r.tableIds);
    return `<div class="ligne" data-r="${r.id}">
      <span class="heure nb">${r.heure}</span>
      <div class="qui"><div class="n">${E(g.nom)} ${vip?'<span class="puce p-or">VIP</span>':''} ${alg?'<span class="puce p-r">Allergie</span>':''}</div>
        <div class="d">${r.couverts} couverts, ${t==='non attribuée'?'table à définir':'table '+t}</div></div>
      ${['confirmee','attente'].includes(r.statut)
        ?`<button class="bt ok" data-arr="${r.id}">${I.ok} Arrivé</button>`
        :`<span class="puce ${r.statut==='installee'?'p-v':'p-b'}">${D.LIB[r.statut]}</span>`}</div>`;
  };

  coque('Ce soir', D.fmtDate(d), `
    ${ferm?`<div class="al-b">${I.al}<div><b>Fermé aujourd'hui</b><span>${E(ferm.raison)}</span></div></div>`:''}
    <div class="actions">
      <button class="act pri" id="a-new">${I.ajout}Nouvelle réservation</button>
      <button class="act" id="a-plan">${I.salle}Placer en salle</button>
      <button class="act" id="a-86">${I.stop}Plat épuisé</button>
    </div>
    <div class="stats">
      <div class="st"><div class="v nb">${cv}</div><div class="k">Couverts</div></div>
      <div class="st"><div class="v nb">${Math.round(cv/cap*100)}%</div><div class="k">Remplissage</div>
        <div class="bar"><i style="width:${Math.min(100,Math.round(cv/cap*100))}%"></i></div></div>
      <div class="st"><div class="v nb">${salle.length}</div><div class="k">En salle</div></div>
      <div class="st ${ret.length?'al':''}"><div class="v nb">${ret.length}</div><div class="k">En retard</div></div>
    </div>
    ${alertes.slice(0,3).map(a=>`<div class="al-b ${a[0]==='or'?'or':''}">${I.al}<div><b>${E(a[1])}</b><span>${E(a[2])}</span></div></div>`).join('')}
    ${ret.length?`<div class="card"><h2 style="color:var(--rouge)">En retard</h2>${ret.map(lg).join('')}</div>`:''}
    <div class="card"><h2>Prochaines arrivées<span class="sp"></span><span class="n2 nb">${att.length}</span></h2>
      ${suite.length?suite.map(lg).join(''):`<div class="vide">${I.vd}Aucune arrivée à venir.<br>Les réservations du site apparaissent ici automatiquement.</div>`}</div>
    ${salle.length?`<div class="card"><h2>Actuellement en salle</h2>${salle.map(lg).join('')}</div>`:''}`);

  $('#a-new').onclick=()=>fNouvelle();
  $('#a-plan').onclick=()=>{ S.vue='salle'; rendre(); };
  $('#a-86').onclick=()=>{ S.vue='carte'; rendre(); };
  $$('[data-arr]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const r=D.db.reservations.find(x=>x.id===b.dataset.arr), av=r.statut;
    D.statut(r.id,'arrivee');
    toast(D.guest(r.guestId).nom+' est arrivé', ()=>{ r.statut=av; D.save(); });
    rendre();
  });
  $$('.ligne[data-r]').forEach(l=>l.onclick=()=>fResa(D.db.reservations.find(x=>x.id===l.dataset.r)));
}

/* ═══ SALLE ═══ */
function vSalle(){
  const d=S.date||D.todayISO();
  const aPlacer=resasDu(d).filter(r=>['confirmee','attente','arrivee'].includes(r.statut)&&!r.tableIds.length);
  const selR=S.sel?D.db.reservations.find(r=>r.id===S.sel):null;
  const zones=D.db.zones.map(z=>{
    const tbs=D.db.tables.filter(t=>t.zoneId===z.id);
    return `<div class="zt">${E(z.nom)}<span class="sp"></span>
      ${z.meteo?`<button class="chip ${z.actif?'on':''}" data-z="${z.id}">${z.actif?'Ouverte':'Fermée'}</button>`:''}</div>
      <div class="grille">${tbs.map(t=>{
        const rr=D.resasActives(d).filter(r=>r.tableIds.includes(t.id));
        const cur=rr.find(r=>['arrivee','installee'].includes(r.statut));
        const nx=rr.find(r=>['confirmee','attente'].includes(r.statut));
        const r=cur||nx, cl=cur?'inst':(nx?'res':'libre'), ch=cur?chrono(cur):null;
        const off=!z.actif||!t.active;
        return `<button class="tbl ${cl} ${S.sel&&!r&&!off?'cible':''}" data-tbl="${t.id}" ${off?'style="opacity:.35"':''}>
          ${ch?`<span class="ch ${ch.long?'long':''} nb">${ch.m}min</span>`:''}
          ${t.numero}<small>${r?E(D.guest(r.guestId).nom.split(' ')[0])+' '+r.couverts+'p':t.capMax+' places'}</small>
        </button>`;}).join('')}</div>`;
  }).join('');

  coque('Salle', D.fmtDate(d), `
    <div class="aide">${I.info}${S.sel?'Touchez maintenant une table libre':'Touchez une réservation à placer, puis une table'}</div>
    ${aPlacer.length?`<div class="card"><h2>À placer<span class="sp"></span><span class="n2 nb">${aPlacer.length}</span></h2>
      <button class="gros" id="auto" style="margin:0 0 12px">${I.ok} Placer tout le monde automatiquement</button>
      ${aPlacer.map(r=>{const g=D.guest(r.guestId);
        return `<div class="ligne"><span class="heure nb">${r.heure}</span>
          <div class="qui"><div class="n">${E(g.nom)}</div>
            <div class="d">${r.couverts} couverts${r.zonePref?', souhaite '+E((D.db.zones.find(z=>z.id===r.zonePref)||{}).nom||''):''}</div></div>
          <button class="bt ${S.sel===r.id?'r':''}" data-sel="${r.id}">${S.sel===r.id?'Choisi':'Placer'}</button></div>`;
      }).join('')}</div>`:''}
    ${zones}
    <div class="leg"><span><i style="border-color:var(--line)"></i>Libre</span>
      <span><i style="border-color:var(--bleu)"></i>Réservée</span>
      <span><i style="border-color:var(--vert)"></i>Installée</span></div>
    ${selR?`<div class="selbar"><span class="sp">${E(D.guest(selR.guestId).nom)}, ${selR.couverts} couverts</span>
      <button id="s-non">Annuler</button></div>`:''}`);

  $$('[data-sel]').forEach(b=>b.onclick=()=>{ S.sel=S.sel===b.dataset.sel?null:b.dataset.sel; rendre(); });
  const sn=$('#s-non'); if(sn) sn.onclick=()=>{ S.sel=null; rendre(); };
  const au=$('#auto');
  if(au) au.onclick=()=>{
    const avant=aPlacer.map(r=>({r,t:[...r.tableIds]}));
    let n=0, echec=0;
    aPlacer.forEach(r=>{
      const t=D.trouveTables(r.date,r.heure,r.couverts,r.zonePref||null)
           || D.trouveTables(r.date,r.heure,r.couverts,null);
      if(t){ r.tableIds=t; n++; } else echec++;
    });
    D.log('Placement automatique, '+n+' tables'); D.save();
    toast(n?(n+' client'+(n>1?'s placés':' placé')+(echec?', '+echec+' sans table libre':'')):'Aucune table libre pour ces réservations',
      n?()=>{ avant.forEach(a=>a.r.tableIds=a.t); D.save(); }:null);
    rendre();
  };
  $$('[data-z]').forEach(b=>b.onclick=()=>{
    const z=D.db.zones.find(x=>x.id===b.dataset.z); z.actif=!z.actif;
    D.log((z.actif?'Ouverture ':'Fermeture ')+z.nom); D.save();
    toast(z.nom+(z.actif?' rouverte':' fermée, créneaux mis à jour')); rendre();
  });
  $$('[data-tbl]').forEach(b=>b.onclick=()=>{
    const tid=b.dataset.tbl;
    const t=D.db.tables.find(x=>x.id===tid);
    if(!t) return;
    if(S.sel){ const res=D.placer(S.sel,tid); toast(res.msg); S.sel=null; rendre(); return; }
    const rr=D.resasActives(d).filter(r=>r.tableIds.includes(tid));
    const r=rr.find(x=>['arrivee','installee'].includes(x.statut))||rr[0];
    if(r) fResa(r);
    else toast('Table '+t.numero+' libre, '+t.capMax+' places');
  });
}

/* ═══ CARTE ═══ */
function vCarte(){
  const cats=[...D.db.menu.categories].sort((a,b)=>a.ordre-b.ordre);
  coque('La carte','Modifiable en direct', `
    <div class="aide">${I.info}Toute modification apparaît aussitôt sur le site client</div>
    <button class="gros" id="c-new" style="margin-bottom:14px">${I.ajout} Ajouter un plat</button>
    ${cats.map(c=>{
      const its=D.db.menu.items.filter(i=>i.catId===c.id).sort((a,b)=>a.ordre-b.ordre);
      return `<div class="card"><h2>${E(c.nom)}<span class="sp"></span><span class="n2 nb">${its.length}</span></h2>
        ${its.map(i=>`<div class="plat ${i.epuise?'off':''}">
          <div class="info" data-ed="${i.id}"><div class="nom">${E(i.nom)}${i.tags.includes('sig')?' <span class="puce p-or">Signature</span>':''}</div>
            <div class="des">${E(i.desc)}</div></div>
          <input class="prix nb" type="number" step="0.5" min="0" value="${i.prix}" data-prix="${i.id}" aria-label="Prix de ${E(i.nom)}">
          <button class="bt ${i.epuise?'ok':'r'}" data-86="${i.id}">${i.epuise?'Remettre':'Épuisé'}</button>
        </div>`).join('')}</div>`;
    }).join('')}`);
  $$('[data-86]').forEach(b=>b.onclick=()=>{
    const i=D.db.menu.items.find(x=>x.id===b.dataset['86']);
    i.epuise=!i.epuise; D.log((i.epuise?'Épuisé ':'Remis ')+i.nom); D.save();
    toast(i.nom+(i.epuise?' retiré du site':' remis sur le site'), ()=>{ i.epuise=!i.epuise; D.save(); });
    rendre();
  });
  $$('[data-prix]').forEach(inp=>{
    inp.onblur=()=>{
      const i=D.db.menu.items.find(x=>x.id===inp.dataset.prix);
      const v=parseFloat(inp.value);
      if(isNaN(v)||v<0){ inp.value=i.prix; return; }
      if(v===i.prix) return;
      const av=i.prix; i.prix=v; D.log('Prix '+i.nom+', '+v+' euros'); D.save();
      toast(i.nom+' à '+v+' euros', ()=>{ i.prix=av; D.save(); });
    };
    inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); };
  });
  $$('[data-ed]').forEach(el=>el.onclick=()=>fPlat(D.db.menu.items.find(x=>x.id===el.dataset.ed)));
  $('#c-new').onclick=()=>fPlat(null);
}

function vResas(){
  const q=S.q.trim().toLowerCase();
  const rs=D.db.reservations.filter(r=>{
    if(!q&&r.date!==(S.date||D.todayISO())) return false;
    if(S.filtre!=='tous'&&r.statut!==S.filtre) return false;
    if(q){ const g=D.guest(r.guestId);
      return g.nom.toLowerCase().includes(q)||g.tel.replace(/\s/g,'').includes(q.replace(/\s/g,''))||r.ref.toLowerCase().includes(q); }
    return true;
  }).sort((a,b)=>q?(b.date+b.heure).localeCompare(a.date+a.heure):a.heure.localeCompare(b.heure));
  coque('Réservations', q?'Recherche sur toutes les dates':D.fmtDate(S.date||D.todayISO()), `
    <input class="rech" id="q" placeholder="Chercher un nom, téléphone ou code" value="${E(S.q)}">
    ${!q?`<div class="rang" style="margin-bottom:12px">
      <button class="chip" id="prev" style="justify-content:center;text-align:center">Jour précédent</button>
      <button class="chip" id="next" style="justify-content:center;text-align:center">Jour suivant</button></div>`:''}
    <div class="chips">${[['tous','Toutes'],['confirmee','Confirmées'],['attente','En attente'],['installee','En salle'],['annulee','Annulées'],['absence','Absences']]
      .map(([k,l])=>`<button class="chip ${S.filtre===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
    <button class="gros" id="new" style="margin-bottom:14px">${I.ajout} Nouvelle réservation</button>
    <div class="card">${rs.length?rs.map(r=>{const g=D.guest(r.guestId);
      const cls={confirmee:'p-b',installee:'p-v',arrivee:'p-v',attente:'p-or',annulee:'p-g',absence:'p-r',terminee:'p-g'}[r.statut]||'p-g';
      return `<div class="ligne" data-r="${r.id}"><span class="heure nb">${r.heure}</span>
        <div class="qui"><div class="n">${E(g.nom)}</div>
          <div class="d">${q?D.fmtShort(r.date)+', ':''}${r.couverts} couverts, ${E(g.tel)}</div></div>
        <span class="puce ${cls}">${D.LIB[r.statut]}</span></div>`;}).join('')
      :`<div class="vide">${I.vd}${q?'Aucun résultat':'Aucune réservation ce jour'}</div>`}</div>`,true);
  const inp=$('#q');
  inp.oninput=e=>{ S.q=e.target.value; const p=e.target.selectionStart; rendre();
    const n=$('#q'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const pv=$('#prev'), nx=$('#next');
  if(pv) pv.onclick=()=>{ S.date=D.addDays(S.date||D.todayISO(),-1); rendre(); };
  if(nx) nx.onclick=()=>{ S.date=D.addDays(S.date||D.todayISO(),1); rendre(); };
  $$('[data-f]').forEach(b=>b.onclick=()=>{ S.filtre=b.dataset.f; rendre(); });
  $('#new').onclick=()=>fNouvelle();
  $$('.ligne[data-r]').forEach(l=>l.onclick=()=>fResa(D.db.reservations.find(x=>x.id===l.dataset.r)));
}

function vClients(){
  const q=S.q.trim().toLowerCase();
  const l=D.db.guests.filter(g=>!q||g.nom.toLowerCase().includes(q)||g.tel.replace(/\s/g,'').includes(q.replace(/\s/g,'')))

function vStats(){
  const n=14, jours=[];
  for(let i=n-1;i>=0;i--) jours.push(D.addDays(D.todayISO(),-i));
  const data=jours.map(d=>{const rs=D.db.reservations.filter(r=>r.date===d);
    return {d,cv:rs.filter(r=>!['annulee','absence'].includes(r.statut)).reduce((s,r)=>s+r.couverts,0),
      abs:rs.filter(r=>r.statut==='absence').length,n:rs.length};});
  const tot=data.reduce((s,x)=>s+x.cv,0), totR=data.reduce((s,x)=>s+x.n,0);
  const abs=data.reduce((s,x)=>s+x.abs,0), cap=D.capaciteTotale();
  const max=Math.max(1,...data.map(d=>d.cv));
  coque('Chiffres','14 derniers jours',`
    <div class="stats">
      <div class="st"><div class="v nb">${tot}</div><div class="k">Couverts</div></div>
      <div class="st"><div class="v nb">${Math.round(tot/n/cap*100)}%</div><div class="k">Remplissage</div></div>
      <div class="st"><div class="v nb">${totR}</div><div class="k">Réservations</div></div>
      <div class="st ${abs?'al':''}"><div class="v nb">${totR?Math.round(abs/totR*100):0}%</div><div class="k">Absences</div></div>
    </div>
    <div class="card"><h2>Couverts par jour</h2>
      <svg viewBox="0 0 340 130" style="width:100%;height:auto" role="img" aria-label="Couverts par jour sur quatorze jours">
        ${data.map((x,i)=>{const h=x.cv/max*94, bw=340/n-5, xx=i*(340/n)+2;
          return `<rect x="${xx}" y="${104-h}" width="${bw}" height="${Math.max(1,h)}" rx="3"
            fill="${x.d===D.todayISO()?'var(--rouge)':'var(--bleu)'}" opacity="${x.d===D.todayISO()?1:.7}"/>
            ${i%3===0?`<text x="${xx+bw/2}" y="120" font-size="8" fill="var(--mut)" text-anchor="middle">${D.fmtShort(x.d).split(' ')[1]}</text>`:''}`;
        }).join('')}
        <line x1="0" y1="104" x2="340" y2="104" stroke="var(--line)" stroke-width="1"/>
      </svg></div>
    <button class="gros sec" id="csv">Exporter en tableur</button>`,true);
  $('#csv').onclick=()=>{
    const csv=['Date;Couverts;Reservations;Absences',...data.map(d=>[d.d,d.cv,d.n,d.abs].join(';'))].join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
    a.download='directoire-chiffres.csv'; a.click(); URL.revokeObjectURL(a.href);
    toast('Fichier téléchargé');
  };
}

        if(r.tableIds.length){
          const deb=D.hm2min(h), fin=deb+D.duree(cv)+D.db.regles.tampon;
          const ok=r.tableIds.every(t=>D.tableLibre(t,date,deb,fin,r.id));

}

    };
  });
}
function fClient(g){
  const h=D.db.reservations.filter(r=>r.guestId===g.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  feuille(`<h3>${E(g.nom)}</h3><p class="ss">${E(g.tel)}</p>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="st"><div class="v nb">${g.visites}</div><div class="k">Visites</div></div>
      <div class="st ${g.absences?'al':''}"><div class="v nb">${g.absences}</div><div class="k">Absences</div></div>
      <div class="st"><div class="v" style="font-size:16px">${g.derniereVisite?D.fmtShort(g.derniereVisite):'Jamais'}</div><div class="k">Dernière</div></div>
    </div>
    <div class="champ"><label>Allergies</label><input id="g-alg" value="${E(g.allergies||'')}" placeholder="Aucune"></div>
    <div class="champ"><label>Préférences et notes</label><input id="g-note" value="${E(g.notes||'')}" placeholder="Table au calme, aime le rosé..."></div>
    <div class="champ"><label>Étiquettes</label><div class="opts" id="g-tg">
      ${['VIP','habitué','allergique'].map(t=>`<button class="opt ${g.tags.includes(t)?'on':''}" data-t="${t}">${t}</button>`).join('')}</div></div>
    ${h.length?`<div class="champ"><label>Dernières venues</label>
      ${h.map(r=>`<div class="ligne" style="padding:9px 0">
        <span class="heure nb" style="font-size:14px;width:auto">${D.fmtShort(r.date)}</span>
        <div class="qui"><div class="d">${r.heure}, ${r.couverts} couverts</div></div>
        <span class="puce p-g">${D.LIB[r.statut]}</span></div>`).join('')}</div>`:''}
    <button class="gros" id="g-ok">Enregistrer</button>
    <button class="gros sec" id="g-non">Retour</button>`, c=>{
    let tags=[...g.tags];
    $$('#g-tg .opt',c).forEach(b=>b.onclick=()=>{
      const t=b.dataset.t; tags=tags.includes(t)?tags.filter(x=>x!==t):[...tags,t]; b.classList.toggle('on'); });
    $('#g-non',c).onclick=fermer;
    $('#g-ok',c).onclick=()=>{
      g.allergies=$('#g-alg',c).value.trim(); g.notes=$('#g-note',c).value.trim(); g.tags=tags;
      D.log('Fiche client, '+g.nom); D.save(); fermer(); toast('Fiche enregistrée'); rendre();
    };
  });
}

function rendre(){
  if(!S.auth) return porte();
  ({soir:vSoir,salle:vSalle,carte:vCarte,plus:vPlus}[S.vue]||vSoir)();
}

D.init();
document.documentElement.dataset.t=localStorage.getItem(K_TH)||'';
S.auth=sessionStorage.getItem('dir.ok')==='1';
rendre();
if(S.auth) visite();
D.onChange(()=>{ if(S.auth&&!$('#couche').innerHTML) rendre(); });
setInterval(()=>{ if(S.auth&&S.vue==='salle'&&!$('#couche').innerHTML) rendre(); },60000);
addEventListener('keydown',e=>{
  if(!S.auth||(e.target.matches&&e.target.matches('input,select,textarea'))) return;
  if(e.key==='Escape'&&$('#couche').innerHTML) fermer();
  else if(e.key==='n'||e.key==='N') fNouvelle();
});
</script>
