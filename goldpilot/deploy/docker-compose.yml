# ---------------------------------------------------------------------------------------------------
# GoldPilot — déploiement de production sur un serveur (VPS) avec Docker Compose.
# Procédure complète, pas à pas : docs/05_deploiement_et_exploitation.md
#
#   cd goldpilot/deploy
#   cp .env.example .env && chmod 600 .env     # puis remplir .env (jamais dans Git)
#   docker compose build
#   docker compose up -d
#
# Services :
#   postgres  base de données (jamais exposée à l'extérieur, réseau interne sans accès Internet)
#   migrate   vérifie la configuration puis applique les migrations, une fois, avant web et engine
#   web       site + API + réception des webhooks TradingView (uvicorn, 1 processus)
#   engine    moteur temps réel (redémarre toujours en cas d'arrêt)
#   caddy     HTTPS automatique (Let's Encrypt), seul service exposé (ports 80 et 443)
#   backup    sauvegarde quotidienne de la base (pg_dump) dans deploy/backups/, conservation N jours
# ---------------------------------------------------------------------------------------------------
name: goldpilot

x-logging: &logging
  # Rotation des journaux : au plus 5 fichiers de 10 Mo par service (≈ 50 Mo), le disque ne se remplit pas.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: goldpilot:${GOLDPILOT_TAG:-latest}
  env_file: .env
  environment:
    # Valeurs imposées par cette architecture (elles remplacent celles du fichier .env) :
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://goldpilot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/goldpilot
    PUBLIC_BASE_URL: https://${GOLDPILOT_DOMAIN:?GOLDPILOT_DOMAIN manquant dans .env}
    TRUST_PROXY: "true"   # web n'est joignable que par caddy, qui fixe X-Forwarded-For (voir Caddyfile)
  read_only: true          # système de fichiers en lecture seule : le code ne peut pas être modifié
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goldpilot
      POSTGRES_DB: goldpilot
      # Lu uniquement à la toute première initialisation du volume (voir la rotation dans docs/05).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldpilot -d goldpilot"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]
    logging: *logging

  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        WITH_DATABENTO: ${WITH_DATABENTO:-0}
    command: ["sh", "-c", "python -m goldpilot.cli check && python -m goldpilot.cli migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    <<: *app
    pull_policy: never   # image construite localement (service migrate) : ne jamais la chercher sur Internet
    restart: unless-stopped
    # Commande par défaut de l'image : uvicorn --factory goldpilot.api.app:create_app, 1 processus.
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]

  engine:
    <<: *app
    pull_policy: never
    restart: always
    command: ["python", "-m", "goldpilot.engine.runner"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py", "engine"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]   # edge : accès sortant (Telegram, calendrier officiel, FRED)

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"       # nécessaire au certificat Let's Encrypt et aux webhooks TradingView (ports 80/443 seulement)
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      GOLDPILOT_DOMAIN: ${GOLDPILOT_DOMAIN:?GOLDPILOT_DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats : à conserver (sinon nouvelle demande à Let's Encrypt)
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_started
    networks: [edge]
    logging: *logging

  backup:
    image: postgres:16-alpine   # même version que le serveur : pg_dump compatible
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: goldpilot
      PGDATABASE: goldpilot
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

networks:
  internal:
    internal: true   # aucun accès Internet ; postgres n'est joignable que par les services GoldPilot
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
