# Contrôle automatique de GoldPilot (tests du backend, compilation et tests du site, construction de
# l'image Docker) à chaque envoi ou demande de fusion qui modifie goldpilot/**.
# Indépendant de deploy.yml (GitHub Pages) : aucun déploiement, aucune permission d'écriture, aucun secret.
name: GoldPilot CI

on:
  push:
    paths:
      - "goldpilot/**"
      - ".github/workflows/goldpilot-ci.yml"
  pull_request:
    paths:
      - "goldpilot/**"
      - ".github/workflows/goldpilot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: goldpilot/backend/pyproject.toml
      - name: Installation
        run: pip install -e "goldpilot/backend[dev,research]"
      - name: Tests
        working-directory: goldpilot/backend
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Site (compilation + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: goldpilot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: goldpilot/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Compilation (vérification TypeScript + Vite)
        run: npm run build
      - name: Tests unitaires
        run: npm test

  docker:
    name: Image Docker (construction seulement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        working-directory: goldpilot
        run: docker build -t goldpilot:ci .
      - name: Configuration Docker Compose valide
        working-directory: goldpilot/deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-not-a-secret/' .env
          docker compose config --quiet
          rm .env
