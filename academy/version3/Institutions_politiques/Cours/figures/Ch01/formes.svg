érences de degré entre toutes ces formes d'États que des différences de nature »</text><text x="360.0" y="30.0" font-size="12" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Les formes d'État, rangées par autonomie croissante des entités qui les composent</text></svg>