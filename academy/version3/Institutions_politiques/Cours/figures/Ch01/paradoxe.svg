<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300"><rect x="150.0" y="12.0" width="400.0" height="58.0" rx="7" fill="#fbecea" stroke="#b3261e" stroke-width="1.6"/><text x="350.0" y="30.3" font-size="11.5" fill="#b3261e" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">LE PARADOXE</text><text x="350.0" y="44.8" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">l'État souverain crée le droit :</text><text x="350.0" y="59.3" font-size="11.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">comment le droit pourrait-il le lier ?</text><rect x="12.0" y="110.0" width="320.0" height="86.0" rx="7" fill="#f3eef8" stroke="#6a3d9a" stroke-width="1.6"/><text x="172.0" y="136.8" font-size="10" fill="#6a3d9a" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">① Le droit naturel</text><text x="172.0" y="149.8" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">un droit « constaté et non pas créé », au-dessus de l'État</text><text x="172.0" y="162.8" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Antigone : peut justifier la désobéissance</text><text x="172.0" y="175.8" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">limites : contenu flou ; la souveraineté n'est plus illimitée</text><rect x="368.0" y="110.0" width="320.0" height="86.0" rx="7" fill="#f3f7fb" stroke="#1f4e79" stroke-width="1.6"/><text x="528.0" y="136.8" font-size="10" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">② L'autolimitation</text><text x="528.0" y="149.8" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">« patere legem quam fecisti »</text><text x="528.0" y="162.8" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">l'État se lie lui-même en posant la règle</text><text x="528.0" y="175.8" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">limite : celui qui se lie peut se délier</text><rect x="130.0" y="222.0" width="440.0" height="66.0" rx="7" fill="#eef6ee" stroke="#2e7d32" stroke-width="1.6"/><text x="350.0" y="245.0" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">③ La réponse n'est pas strictement juridique, mais politique</text><text x="350.0" y="258.5" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">l'État de droit : « récent, fragile, loin d'être universel »</text><text x="350.0" y="272.0" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">+ la légitimité : un pouvoir accepté par les gouvernés</text><defs><marker id="s8c929c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c929c"/></marker></defs><path d="M350.0,70.0 L172.0,110.0" fill="none" stroke="#8c929c" stroke-width="1.8" marker-end="url(#s8c929c)"/><defs><marker id="s8c929c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c929c"/></marker></defs><path d="M350.0,70.0 L528.0,110.0" fill="none" stroke="#8c929c" stroke-width="1.8" marker-end="url(#s8c929c)"/><defs><marker id="s8c929c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c929c"/></marker></defs><path d="M172.0,196.0 L350.0,222.0" fill="none" stroke="#8c929c" stroke-width="1.8" marker-end="url(#s8c929c)"/><defs><marker id="s8c929c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c929c"/></marker></defs><path d="M528.0,196.0 L350.0,222.0" fill="none" stroke="#8c929c" stroke-width="1.8" marker-end="url(#s8c929c)"/></svg>