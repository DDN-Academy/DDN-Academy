DROIT COMMUN</text><defs><marker id="sc26a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/></marker></defs><path d="M455.0,232.0 L290.0,128.0" fill="none" stroke="#c26a00" stroke-width="1.8" marker-end="url(#sc26a00)"/><rect x="548.0" y="118.0" width="162.0" height="124.0" rx="7" fill="#fdf3e6" stroke="#c26a00" stroke-width="1.6"/><text x="629.0" y="144.3" font-size="10" fill="#c26a00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">PARTICIPATION</text><text x="629.0" y="157.3" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la seconde chambre</text><text x="629.0" y="170.3" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(Sénat, Bundesrat)</text><text x="629.0" y="183.3" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la désignation de l'exécutif</text><text x="629.0" y="196.3" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la révision : aux États-Unis,</text><text x="629.0" y="209.3" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">⅔ du Congrès puis ¾ des</text><text x="629.0" y="222.3" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">États fédérés, soit 38</text><text x="454.0" y="186.0" font-size="10" fill="#c26a00" text-anchor="start" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">les États fédérés</text><text x="454.0" y="200.0" font-size="10" fill="#c26a00" text-anchor="start" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">participent →</text><text x="360.0" y="24.0" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">SUPERPOSITION : un nouvel État se superpose aux États membres — « il les englobe mais ne les absorbe pas »</text><text x="360.0" y="334.0" font-size="10.5" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">AUTONOMIE : tout se dédouble — deux territoires, deux citoyennetés (fédérale et fédérée), deux Constitutions</text><text x="360.0" y="352.0" font-size="10" fill="#8c929c" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">Le partage est protégé par une juridiction constitutionnelle (Cour suprême, Cour constitutionnelle allemande)</text></svg>