<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"><text x="180.0" y="22.0" font-size="13" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">DÉCONCENTRATION</text><text x="180.0" y="38.0" font-size="10" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">« le même marteau, un manche raccourci »</text><rect x="60.0" y="52.0" width="240.0" height="52.0" rx="7" fill="#f3f7fb" stroke="#1f4e79" stroke-width="1.6"/><text x="180.0" y="74.7" font-size="11" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">L'État (le gouvernement)</text><text x="180.0" y="88.7" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">centre unique de décision</text><rect x="60.0" y="190.0" width="240.0" height="62.0" rx="7" fill="#f3f7fb" stroke="#1f4e79" stroke-width="1.6"/><text x="180.0" y="211.0" font-size="10.5" fill="#1f4e79" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Préfet, recteur, procureur…</text><text x="180.0" y="224.5" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">une AUTORITÉ DE L'ÉTAT</text><text x="180.0" y="238.0" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">dans une circonscription administrative</text><defs><marker id="s1f4e79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker></defs><path d="M180.0,104.0 L180.0,190.0" fill="none" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#s1f4e79)"/><text x="186.0" y="132.0" font-size="10" fill="#1f4e79" text-anchor="start" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">nomme et révoque (les personnes)</text><text x="186.0" y="148.0" font-size="10" fill="#1f4e79" text-anchor="start" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">injonction, réformation (les actes)</text><text x="186.0" y="164.0" font-size="10" fill="#1f4e79" text-anchor="start" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">= contrôle HIÉRARCHIQUE</text><text x="180.0" y="276.0" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">aucune autonomie : un agent de l'État</text><line x1="360.0" y1="16.0" x2="360.0" y2="300.0" stroke="#8c929c" stroke-width="1" stroke-dasharray="4 3"/><text x="540.0" y="22.0" font-size="13" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">DÉCENTRALISATION</text><text x="540.0" y="38.0" font-size="10" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">« le marteau a changé de main »</text><rect x="390.0" y="52.0" width="130.0" height="52.0" rx="7" fill="#eef6ee" stroke="#2e7d32" stroke-width="1.6"/><text x="455.0" y="74.7" font-size="11" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Les électeurs</text><text x="455.0" y="88.7" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">locaux</text><rect x="560.0" y="52.0" width="150.0" height="52.0" rx="7" fill="#f4f4f4" stroke="#8c929c" stroke-width="1.6"/><text x="635.0" y="68.0" font-size="10.5" fill="#8c929c" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">La loi nationale</text><text x="635.0" y="81.5" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">fixe le domaine</text><text x="635.0" y="95.0" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(article 72 al. 3)</text><rect x="390.0" y="190.0" width="170.0" height="62.0" rx="7" fill="#eef6ee" stroke="#2e7d32" stroke-width="1.6"/><text x="475.0" y="211.0" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Conseil élu d'une</text><text x="475.0" y="224.5" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">COLLECTIVITÉ TERRITORIALE</text><text x="475.0" y="238.0" font-size="10.5" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">personne morale distincte</text><rect x="590.0" y="190.0" width="120.0" height="62.0" rx="7" fill="#f4f4f4" stroke="#8c929c" stroke-width="1.6"/><text x="650.0" y="217.7" font-size="11" fill="#8c929c" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">L'État</text><text x="650.0" y="231.7" font-size="11" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(le préfet)</text><defs><marker id="s2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs><path d="M455.0,104.0 L475.0,190.0" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#s2e7d32)"/><text x="465.0" y="142.0" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">élisent</text><defs><marker id="s8c929c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c929c"/></marker></defs><path d="M635.0,104.0 L475.0,190.0" fill="none" stroke="#8c929c" stroke-width="1.8" marker-end="url(#s8c929c)"/><defs><marker id="cl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c26a00"/></marker></defs><line x1="590.0" y1="232.0" x2="562.0" y2="232.0" stroke="#c26a00" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#cl)"/><text x="650.0" y="270.0" font-size="9.5" fill="#c26a00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">contrôle de légalité (tutelle) :</text><text x="650.0" y="284.0" font-size="9.5" fill="#c26a00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">la conformité au droit,</text><text x="650.0" y="298.0" font-size="9.5" fill="#c26a00" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">jamais l'opportunité</text><text x="475.0" y="276.0" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">autonomie juridique et financière,</text><text x="475.0" y="290.0" font-size="10" fill="#1d2330" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">pas l'indépendance</text><text x="360.0" y="322.0" font-size="11" fill="#b3261e" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Le test : qui peut révoquer celui qui décide ? L'État → déconcentration · les électeurs → décentralisation</text></svg>